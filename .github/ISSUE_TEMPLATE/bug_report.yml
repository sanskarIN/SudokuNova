name: Bug report
description: Report a reproducible SudokuNova problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SudokuNova. Do not report exploitable security vulnerabilities here; follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: SudokuNova version / commit
      placeholder: "0.1.0-debug or commit SHA"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or emulator
      placeholder: "Example: Pixel 9 emulator"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version / API level
      placeholder: "Example: Android 16 / API 36"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, credentials, email contents, and other private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a private security vulnerability.
          required: true
