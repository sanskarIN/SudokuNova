name: Documentation issue
description: Report missing, inaccurate, confusing, or outdated documentation
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      placeholder: "README.md, docs/BUILDING.md, in-app help, etc."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I verified this against the current repository state.
          required: true
