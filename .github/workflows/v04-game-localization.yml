name: Apply v0.4 Game Localization

on:
  push:
    branches:
      - feature/v0.4-accessibility-localization
    paths:
      - .github/workflows/v04-game-localization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4-accessibility-localization
          fetch-depth: 0

      - name: Migrate core game strings to localized resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/sanskar/sudokunova/ui/game/GameScreen.kt')
          text = path.read_text()

          if 'import androidx.compose.ui.res.stringResource' not in text:
              text = text.replace(
                  'import androidx.compose.ui.platform.LocalView\n',
                  'import androidx.compose.ui.platform.LocalView\nimport androidx.compose.ui.res.stringResource\n',
                  1,
              )
          if 'import com.sanskar.sudokunova.R' not in text:
              text = text.replace(
                  'import com.sanskar.sudokunova.data.InputMode\n',
                  'import com.sanskar.sudokunova.R\nimport com.sanskar.sudokunova.data.InputMode\n',
                  1,
              )
          if 'import com.sanskar.sudokunova.ui.common.localizedDifficultyLabel' not in text:
              text = text.replace(
                  'import com.sanskar.sudokunova.game.GameStatus\n',
                  'import com.sanskar.sudokunova.game.GameStatus\nimport com.sanskar.sudokunova.ui.common.localizedDifficultyLabel\n',
                  1,
              )

          replacements = {
              'Text("SudokuNova")': 'Text(stringResource(R.string.v04_app_name))',
              'contentDescription = "Back"': 'contentDescription = stringResource(R.string.v04_back)',
              'Text("Generating a unique puzzle…")': 'Text(stringResource(R.string.v04_generating_unique_puzzle))',
              'Text("New game")': 'Text(stringResource(R.string.v04_new_game))',
              'Text("Apply hint")': 'Text(stringResource(R.string.v04_apply_hint))',
              'Text("Not now")': 'Text(stringResource(R.string.v04_not_now))',
              'title = { Text("Puzzle complete!") }': 'title = { Text(stringResource(R.string.v04_puzzle_complete)) }',
              'Text("Play another")': 'Text(stringResource(R.string.v04_play_another))',
              'Text("Home")': 'Text(stringResource(R.string.v04_home))',
              'title = { Text("Mistake limit reached") }': 'title = { Text(stringResource(R.string.v04_mistake_limit_reached)) }',
              'text = { Text("You can restart this puzzle and try again.") }': 'text = { Text(stringResource(R.string.v04_restart_try_again)) }',
              'Text("Restart")': 'Text(stringResource(R.string.v04_restart))',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          old_summary = '''Text(
                                  "${game.difficulty.displayName} solved in ${formatTime(game.elapsedSeconds)} " +
                                      "with ${game.mistakes} mistake(s) and ${game.hintsUsed} hint(s).",
                              )'''
          new_summary = '''Text(
                                  stringResource(
                                      R.string.v04_completion_summary,
                                      localizedDifficultyLabel(game.difficulty),
                                      formatTime(game.elapsedSeconds),
                                      game.mistakes,
                                      game.hintsUsed,
                                  ),
                              )'''
          if old_summary in text:
              text = text.replace(old_summary, new_summary, 1)

          text = text.replace(
              'Text(game.difficulty.displayName, style = MaterialTheme.typography.titleLarge)',
              'Text(localizedDifficultyLabel(game.difficulty), style = MaterialTheme.typography.titleLarge)',
              1,
          )
          text = text.replace(
              'Text("${game.progressPercent}% complete", style = MaterialTheme.typography.bodyLarge)',
              'Text(stringResource(R.string.v04_percent_complete, game.progressPercent), style = MaterialTheme.typography.bodyLarge)',
              1,
          )
          old_number_first = '''game.selectedNumber?.let { "Number-first: $it selected" } ?: "Number-first: choose a number"'''
          new_number_first = '''game.selectedNumber?.let {
                          stringResource(R.string.v04_number_first_selected, it)
                      } ?: stringResource(R.string.v04_number_first_choose)'''
          text = text.replace(old_number_first, new_number_first, 1)
          old_mistakes = '''Text("Mistakes: ${game.mistakes}${if (settings.mistakeLimit > 0) "/${settings.mistakeLimit}" else ""}")'''
          new_mistakes = '''Text(
                      if (settings.mistakeLimit > 0) {
                          stringResource(R.string.v04_mistakes_limited, game.mistakes, settings.mistakeLimit)
                      } else {
                          stringResource(R.string.v04_mistakes_unlimited, game.mistakes)
                      },
                  )'''
          text = text.replace(old_mistakes, new_mistakes, 1)

          action_replacements = {
              'ActionButton("Undo",': 'ActionButton(stringResource(R.string.v04_undo),',
              'ActionButton("Redo",': 'ActionButton(stringResource(R.string.v04_redo),',
              'ActionButton("Erase",': 'ActionButton(stringResource(R.string.v04_erase),',
              'if (game.notesMode) "Notes on" else "Notes",': 'if (game.notesMode) stringResource(R.string.v04_notes_on) else stringResource(R.string.v04_notes),',
              'ActionButton("Hint",': 'ActionButton(stringResource(R.string.v04_hint),',
              'if (game.isPaused) "Resume" else "Pause",': 'if (game.isPaused) stringResource(R.string.v04_resume) else stringResource(R.string.v04_pause),',
              'ActionButton("Restart",': 'ActionButton(stringResource(R.string.v04_restart),',
          }
          for old, new in action_replacements.items():
              text = text.replace(old, new)

          path.write_text(text)
          PY

          git rm .github/workflows/v04-game-localization.yml
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add app/src/main/java/com/sanskar/sudokunova/ui/game/GameScreen.kt
          git commit -m 'feat: localize core game screen strings'

          for attempt in 1 2 3 4 5 6; do
            git fetch origin feature/v0.4-accessibility-localization
            git rebase origin/feature/v0.4-accessibility-localization
            if git push origin HEAD:feature/v0.4-accessibility-localization; then
              exit 0
            fi
            sleep 2
          done
          exit 1
