name: Production Release Validation

on:
  workflow_dispatch:
    inputs:
      expected_version_code:
        description: Expected Android versionCode for the selected ref
        required: true
        type: string
        default: '1000'
      expected_version_name:
        description: Expected Android versionName for the selected ref
        required: true
        type: string
        default: '1.0.0-rc.1'
      upload_signed_artifacts:
        description: Upload signed APK/AAB in addition to verification evidence
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-signed-release:
    name: validate-signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-release

    env:
      SUDOKUNOVA_KEYSTORE_BASE64: ${{ secrets.SUDOKUNOVA_KEYSTORE_BASE64 }}
      SUDOKUNOVA_KEYSTORE_PASSWORD: ${{ secrets.SUDOKUNOVA_KEYSTORE_PASSWORD }}
      SUDOKUNOVA_KEY_ALIAS: ${{ secrets.SUDOKUNOVA_KEY_ALIAS }}
      SUDOKUNOVA_KEY_PASSWORD: ${{ secrets.SUDOKUNOVA_KEY_PASSWORD }}
      SUDOKUNOVA_APK_CERT_SHA256: ${{ secrets.SUDOKUNOVA_APK_CERT_SHA256 }}
      SUDOKUNOVA_AAB_CERT_SHA256: ${{ secrets.SUDOKUNOVA_AAB_CERT_SHA256 }}

    steps:
      - name: Checkout selected release ref
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Require protected release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            SUDOKUNOVA_KEYSTORE_BASE64 \
            SUDOKUNOVA_KEYSTORE_PASSWORD \
            SUDOKUNOVA_KEY_ALIAS \
            SUDOKUNOVA_KEY_PASSWORD \
            SUDOKUNOVA_APK_CERT_SHA256 \
            SUDOKUNOVA_AAB_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Missing required protected release secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Materialize release keystore outside the repository
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/sudokunova-release-keystore"
          printf '%s' "$SUDOKUNOVA_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if [ ! -s "$keystore" ]; then
            echo 'Decoded release keystore is empty.' >&2
            exit 1
          fi
          echo "SUDOKUNOVA_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Verify repository security guard
        run: python scripts/verify_no_secrets.py

      - name: Verify release verifier regression suite
        run: python -m unittest scripts.tests.test_verify_release_outputs

      - name: Verify English/Hindi translation parity
        run: python scripts/verify_translations.py

      - name: Build signed release APK and AAB with R8
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Locate signed release outputs and apksigner
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            printf 'Expected exactly one signed release APK, found %s\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          mapfile -t aabs < <(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | sort)
          if [ "${#aabs[@]}" -ne 1 ]; then
            printf 'Expected exactly one release AAB, found %s\n' "${#aabs[@]}" >&2
            printf '%s\n' "${aabs[@]}" >&2
            exit 1
          fi
          apksigner_path="$(find "$ANDROID_SDK_ROOT/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo 'Unable to locate Android SDK apksigner.' >&2
            exit 1
          fi
          echo "$(dirname "$apksigner_path")" >> "$GITHUB_PATH"
          echo "RELEASE_APK=${apks[0]}" >> "$GITHUB_ENV"
          echo "RELEASE_AAB=${aabs[0]}" >> "$GITHUB_ENV"

      - name: Verify signatures, certificate identities, metadata, R8, and hashes
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='app/build/outputs/release-evidence/production'
          mkdir -p "$evidence_dir"
          python scripts/verify_release_outputs.py \
            --apk "$RELEASE_APK" \
            --aab "$RELEASE_AAB" \
            --mapping app/build/outputs/mapping/release/mapping.txt \
            --metadata app/build/outputs/apk/release/output-metadata.json \
            --expected-version-code '${{ inputs.expected_version_code }}' \
            --expected-version-name '${{ inputs.expected_version_name }}' \
            --require-signatures \
            --expected-apk-cert-sha256 "$SUDOKUNOVA_APK_CERT_SHA256" \
            --expected-aab-cert-sha256 "$SUDOKUNOVA_AAB_CERT_SHA256" \
            --output "$evidence_dir/sha256.txt" \
            --signature-output "$evidence_dir/signatures.txt" \
            | tee "$evidence_dir/verification.txt"

      - name: Record immutable workflow context
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir='app/build/outputs/release-evidence/production'
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "expected_version_code=${{ inputs.expected_version_code }}"
            echo "expected_version_name=${{ inputs.expected_version_name }}"
          } > "$evidence_dir/workflow-context.txt"

      - name: Upload production validation evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: production-release-validation-evidence
          path: app/build/outputs/release-evidence/production/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release artifacts when explicitly requested
        if: ${{ success() && inputs.upload_signed_artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-production-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove materialized keystore
        if: always()
        shell: bash
        run: |
          if [ -n "${SUDOKUNOVA_KEYSTORE_PATH:-}" ]; then
            rm -f -- "$SUDOKUNOVA_KEYSTORE_PATH"
          fi
