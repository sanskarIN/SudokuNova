name: Cross-Platform CI

on:
  push:
    branches:
      - main
    paths:
      - 'sharedUI/**'
      - 'sudoku-engine/**'
      - 'app/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/cross-platform.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shared-code:
    name: Shared code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Test shared Sudoku engine
        run: ./gradlew :sudoku-engine:desktopTest --stacktrace
      - name: Test shared gameplay state
        run: ./gradlew :sharedUI:desktopTest --stacktrace
      - name: Compile shared Desktop UI
        run: ./gradlew :sharedUI:compileKotlinDesktop --stacktrace
      - name: Compile shared Web/Wasm UI
        run: ./gradlew :sharedUI:compileKotlinWasmJs --stacktrace

  android:
    name: Android shared integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble Android debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

  web:
    name: Web/Wasm distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build production WebAssembly distribution
        run: ./gradlew :sharedUI:wasmJsBrowserDistribution --stacktrace
      - name: Verify browser release ZIP against source version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from pathlib import Path; from scripts.verify_release_contract import parse_gradle_release_contract; print(parse_gradle_release_contract(Path("app/build.gradle.kts").read_text(encoding="utf-8")).version_name)')"
          python -m scripts.release_artifacts stage --kind web --tag "v$version"
      - name: Upload validated browser release candidate
        uses: actions/upload-artifact@v7
        with:
          name: sudokunova-web-release-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload web distribution
        uses: actions/upload-artifact@v7
        with:
          name: sudokunova-web
          path: sharedUI/build/dist/wasmJs/productionExecutable/**
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator framework
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Link iOS Simulator framework
        run: ./gradlew :sharedUI:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Verify iOS simulator framework ZIP against source version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from pathlib import Path; from scripts.verify_release_contract import parse_gradle_release_contract; print(parse_gradle_release_contract(Path("app/build.gradle.kts").read_text(encoding="utf-8")).version_name)')"
          python -m scripts.release_artifacts stage --kind ios-simulator --tag "v$version"
      - name: Upload validated iOS simulator framework candidate
        uses: actions/upload-artifact@v7
        with:
          name: sudokunova-ios-release-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload iOS framework
        uses: actions/upload-artifact@v7
        with:
          name: sudokunova-ios-simulator-framework
          path: sharedUI/build/bin/iosSimulatorArm64/debugFramework/**
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
            package_task: packageDeb
          - os: windows-latest
            artifact: windows
            package_task: packageMsi
          - os: macos-latest
            artifact: macos
            package_task: packageDmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build desktop application image
        run: ./gradlew :sharedUI:createDistributable --stacktrace
      - name: Build platform-native release installer
        run: ./gradlew :sharedUI:${{ matrix.package_task }} --stacktrace
      - name: Verify installer package for current source version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from pathlib import Path; from scripts.verify_release_contract import parse_gradle_release_contract; print(parse_gradle_release_contract(Path("app/build.gradle.kts").read_text(encoding="utf-8")).version_name)')"
          python -m scripts.release_artifacts stage --kind "${{ matrix.artifact }}" --tag "v$version"
      - name: Upload validated installer candidate
        uses: actions/upload-artifact@v7
        with:
          name: sudokunova-${{ matrix.artifact }}-installer-candidate
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload desktop application image
        uses: actions/upload-artifact@v7
        with:
          name: sudokunova-${{ matrix.artifact }}
          path: sharedUI/build/compose/binaries/main/app/**
          if-no-files-found: error
          retention-days: 14
