name: Cross-Platform CI

on:
  push:
    branches:
      - main
      - feature/cross-platform-kmp
    paths:
      - 'sharedUI/**'
      - 'sudoku-engine/**'
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/cross-platform.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test shared Sudoku engine
        run: ./gradlew :sudoku-engine:desktopTest --stacktrace
      - name: Compile shared desktop UI
        run: ./gradlew :sharedUI:compileKotlinDesktop --stacktrace
      - name: Compile shared web UI
        run: ./gradlew :sharedUI:compileKotlinWasmJs --stacktrace

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble Android debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build production WebAssembly distribution
        run: ./gradlew :sharedUI:wasmJsBrowserDistribution --stacktrace
      - name: Upload web distribution
        uses: actions/upload-artifact@v7
        with:
          name: sudokunova-web
          path: sharedUI/build/dist/wasmJs/productionExecutable/**
          if-no-files-found: warn
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Link iOS Simulator framework
        run: ./gradlew :sharedUI:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Upload iOS framework
        uses: actions/upload-artifact@v7
        with:
          name: sudokunova-ios-simulator-framework
          path: sharedUI/build/bin/iosSimulatorArm64/debugFramework/**
          if-no-files-found: error
          retention-days: 14

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build desktop application image
        run: ./gradlew :sharedUI:createDistributable --stacktrace
      - name: Upload desktop application image
        uses: actions/upload-artifact@v7
        with:
          name: sudokunova-${{ matrix.artifact }}
          path: sharedUI/build/compose/binaries/main/app/**
          if-no-files-found: warn
          retention-days: 14
