name: Apply v0.7 Final Review Fixes Once

on:
  push:
    branches:
      - feature/v0.7-safe-sharing
    paths:
      - '.github/workflows/v07-final-review-fixes-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.7-safe-sharing
          fetch-depth: 0

      - name: Apply reviewed source fixes
        run: python3 scripts/v07_final_review_fix.py

      - name: Commit reviewed fixes
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add app/src/main/java/com/sanskar/sudokunova/ui/transfer/TransferScreen.kt
          git add app/src/main/java/com/sanskar/sudokunova/data/transfer/BackupCodec.kt
          git add app/src/main/java/com/sanskar/sudokunova/data/transfer/BackupRepository.kt
          git add app/src/androidTest/java/com/sanskar/sudokunova/data/transfer/BackupRepositoryTest.kt
          git add app/src/test/java/com/sanskar/sudokunova/data/transfer/BackupCodecHardeningTest.kt
          git commit -m "fix: harden v0.7 restore merge and file IO"
          git push origin HEAD:feature/v0.7-safe-sharing
