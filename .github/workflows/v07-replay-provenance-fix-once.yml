name: Apply v0.7 Replay Provenance Fix Once

on:
  push:
    branches:
      - feature/v0.7-safe-sharing
    paths:
      - '.github/workflows/v07-replay-provenance-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.7-safe-sharing
          fetch-depth: 0

      - name: Apply replay provenance fix
        run: python3 scripts/v07_replay_provenance_fix.py

      - name: Commit replay provenance fix
        run: |
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add app/src/main/java/com/sanskar/sudokunova/data/transfer/BackupModels.kt
          git add app/src/main/java/com/sanskar/sudokunova/data/transfer/BackupCodec.kt
          git add app/src/main/java/com/sanskar/sudokunova/data/transfer/BackupRepository.kt
          git add app/src/test/java/com/sanskar/sudokunova/data/transfer/BackupCodecTest.kt
          git add app/src/androidTest/java/com/sanskar/sudokunova/data/transfer/BackupRepositoryTest.kt
          git add docs/TRANSFER_BACKUP_V07.md
          git commit -m "fix: preserve replay provenance in v0.7 backups"
          git push origin HEAD:feature/v0.7-safe-sharing
