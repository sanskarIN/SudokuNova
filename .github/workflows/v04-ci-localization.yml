name: Apply v0.4 Localization CI Gate

on:
  push:
    branches:
      - feature/v0.4-accessibility-localization
    paths:
      - .github/workflows/v04-ci-localization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4-accessibility-localization
          fetch-depth: 0

      - name: Add translation parity verification to standard CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          marker = '''      - name: Set up Gradle cache and validate wrapper
                  uses: gradle/actions/setup-gradle@v6

          '''
          addition = '''      - name: Set up Gradle cache and validate wrapper
                  uses: gradle/actions/setup-gradle@v6

                - name: Verify English/Hindi translation parity
                  run: python scripts/verify_translations.py

          '''
          if 'Verify English/Hindi translation parity' not in text:
              if marker not in text:
                  raise SystemExit('CI Gradle setup block not found')
              text = text.replace(marker, addition, 1)
          path.write_text(text)
          PY

          git rm .github/workflows/v04-ci-localization.yml
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add .github/workflows/ci.yml
          git commit -m 'ci: verify English and Hindi translation parity'

          for attempt in 1 2 3 4 5 6; do
            git fetch origin feature/v0.4-accessibility-localization
            git rebase origin/feature/v0.4-accessibility-localization
            if git push origin HEAD:feature/v0.4-accessibility-localization; then exit 0; fi
            sleep 2
          done
          exit 1
