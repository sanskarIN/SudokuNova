name: Android CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Locate APK Analyzer
        shell: bash
        run: |
          set -euo pipefail
          apkanalyzer_path="$(command -v apkanalyzer || true)"
          if [ -z "$apkanalyzer_path" ]; then
            apkanalyzer_path="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name apkanalyzer -print 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$apkanalyzer_path" ]; then
            echo 'Unable to locate Android SDK apkanalyzer.' >&2
            exit 1
          fi
          echo "$(dirname "$apkanalyzer_path")" >> "$GITHUB_PATH"

      - name: Verify repository security guard
        run: python scripts/verify_no_secrets.py

      - name: Verify release artifact verifier tests
        run: |
          python -m unittest scripts.tests.test_verify_release_outputs
          python -m unittest scripts.tests.test_verify_release_cli_validation

      - name: Verify repository guard regression tests
        run: |
          python -m unittest scripts.tests.test_verify_documentation_links
          python -m unittest scripts.tests.test_verify_documentation_coverage
          python -m unittest scripts.tests.test_verify_release_contract

      - name: Verify partial release signing fails closed
        shell: bash
        run: |
          set +e
          SUDOKUNOVA_KEY_ALIAS=partial-test ./gradlew :app:tasks --quiet > partial-signing.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Gradle unexpectedly accepted a partial release-signing environment."
            cat partial-signing.log
            exit 1
          fi
          if ! grep -q "Release signing is partially configured" partial-signing.log; then
            echo "Gradle failed, but not for the expected partial-signing guard."
            cat partial-signing.log
            exit 1
          fi
          echo "Partial release signing failed closed as expected."

      - name: Verify repository consistency guards
        run: |
          python scripts/verify_documentation_links.py
          python scripts/verify_documentation_coverage.py
          python scripts/verify_release_contract.py

      - name: Verify English/Hindi translation parity
        run: python scripts/verify_translations.py

      - name: Verify engine tests
        run: ./gradlew :sudoku-engine:test --stacktrace

      - name: Verify Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile Android instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Compile Macrobenchmark harness
        run: ./gradlew :macrobenchmark:assembleBenchmark --stacktrace

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug :app:lintRelease --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            for report in \
              app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt \
              app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt; do
              if [ -f "$report" ]; then
                echo "----- $report -----"
                cat "$report"
              fi
            done
          fi
          exit "$status"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APK with R8
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build release Android App Bundle
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Verify release outputs and generate SHA-256 evidence
        run: |
          python scripts/verify_release_outputs.py \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --mapping app/build/outputs/mapping/release/mapping.txt \
            --metadata app/build/outputs/apk/release/output-metadata.json \
            --expected-version-code 1000 \
            --expected-version-name 1.0.0-rc.1 \
            --expected-application-id in.sanskar.sudokunova \
            --require-apk-manifest \
            --expected-min-sdk 26 \
            --expected-target-sdk 37 \
            --output app/build/outputs/release-evidence/sha256.txt \
            --apk-identity-output app/build/outputs/release-evidence/apk-identity.txt

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release build outputs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-release-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/**
            app/build/outputs/release-evidence/**
          if-no-files-found: error
          retention-days: 14
