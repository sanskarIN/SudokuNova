name: Android CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Verify English/Hindi translation parity
        run: python scripts/verify_translations.py

      - name: Verify engine tests
        run: ./gradlew :sudoku-engine:test --stacktrace

      - name: Verify Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile Android instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug :app:lintRelease --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            for report in \
              app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt \
              app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt; do
              if [ -f "$report" ]; then
                echo "----- $report -----"
                cat "$report"
              fi
            done
          fi
          exit "$status"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release APK with R8
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build release Android App Bundle
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release build outputs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-release-builds
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/**
          if-no-files-found: error
          retention-days: 14
