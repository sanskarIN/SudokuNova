name: Android CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6

      - name: Verify English/Hindi translation parity
        run: python scripts/verify_translations.py

      - name: Verify engine tests
        run: ./gradlew :sudoku-engine:test --stacktrace

      - name: Verify Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile Android instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Run Android lint
        shell: bash
        run: |
          set +e
          ./gradlew :app:lintDebug --stacktrace
          status=$?
          if [ "$status" -ne 0 ]; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "----- FULL ANDROID LINT REPORT -----"
              cat "$report"
            fi
          fi
          exit "$status"

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
