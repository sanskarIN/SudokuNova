name: Apply v0.4 Home Localization

on:
  push:
    branches:
      - feature/v0.4-accessibility-localization
    paths:
      - .github/workflows/v04-home-localization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4-accessibility-localization
          fetch-depth: 0

      - name: Migrate home strings to resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/sanskar/sudokunova/ui/home/HomeScreen.kt')
          text = path.read_text()
          if 'import androidx.compose.ui.res.stringResource' not in text:
              text = text.replace('import androidx.compose.ui.Modifier\n', 'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.res.stringResource\n', 1)
          if 'import com.sanskar.sudokunova.R' not in text:
              marker = 'import com.sanskar.sudokunova.engine.Difficulty\n'
              if marker in text:
                  text = text.replace(marker, 'import com.sanskar.sudokunova.R\n' + marker, 1)
              else:
                  text = text.replace('package com.sanskar.sudokunova.ui.home\n', 'package com.sanskar.sudokunova.ui.home\n\nimport com.sanskar.sudokunova.R', 1)
          if 'localizedDifficultyLabel' not in text:
              marker = 'import com.sanskar.sudokunova.engine.Difficulty\n'
              if marker in text:
                  text = text.replace(marker, marker + 'import com.sanskar.sudokunova.ui.common.localizedDifficultyLabel\n', 1)

          simple = {
              'Text("SudokuNova")': 'Text(stringResource(R.string.v04_app_name))',
              'Text("Think. Solve. Master the Grid.")': 'Text(stringResource(R.string.v04_tagline))',
              'Text("Continue Game")': 'Text(stringResource(R.string.v04_continue_game))',
              'Text("Daily Challenge")': 'Text(stringResource(R.string.v04_daily_challenge))',
              'Text("Quick Play")': 'Text(stringResource(R.string.v04_quick_play))',
              'Text("Choose a difficulty")': 'Text(stringResource(R.string.v04_choose_difficulty))',
              'Text("Custom")': 'Text(stringResource(R.string.v04_custom))',
              'Text("Learn")': 'Text(stringResource(R.string.v04_learn))',
              'Text("Statistics")': 'Text(stringResource(R.string.v04_statistics))',
              'Text("Settings")': 'Text(stringResource(R.string.v04_settings))',
              'Text("About")': 'Text(stringResource(R.string.v04_about))',
              'Text("Support Development")': 'Text(stringResource(R.string.v04_support_development))',
              'Text("Buy Me a Coffee")': 'Text(stringResource(R.string.v04_buy_me_a_coffee))',
              'Text("☕ Buy Me a Coffee")': 'Text("☕ ${stringResource(R.string.v04_buy_me_a_coffee)}")',
              'Text("Support continued open-source development.")': 'Text(stringResource(R.string.v04_support_optional))',
          }
          for old, new in simple.items():
              text = text.replace(old, new)

          text = text.replace('Text(difficulty.displayName)', 'Text(localizedDifficultyLabel(difficulty))')
          text = text.replace('Text(text = difficulty.displayName)', 'Text(text = localizedDifficultyLabel(difficulty))')
          path.write_text(text)
          PY

          git rm .github/workflows/v04-home-localization.yml
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add app/src/main/java/com/sanskar/sudokunova/ui/home/HomeScreen.kt
          git commit -m 'feat: localize home screen strings'

          for attempt in 1 2 3 4 5 6; do
            git fetch origin feature/v0.4-accessibility-localization
            git rebase origin/feature/v0.4-accessibility-localization
            if git push origin HEAD:feature/v0.4-accessibility-localization; then exit 0; fi
            sleep 2
          done
          exit 1
