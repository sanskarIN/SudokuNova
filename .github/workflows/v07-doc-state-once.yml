name: Record v0.7 Project State Once

on:
  push:
    branches:
      - feature/v0.7-safe-sharing
    paths:
      - '.github/workflows/v07-doc-state-once.yml'

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.7-safe-sharing
          fetch-depth: 0
      - name: Update what_changed and roadmap status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          changed = Path('what_changed.md')
          text = changed.read_text()
          marker = '# What Changed\n'
          section = '''# What Changed\n\n## Current v0.7 Development — Safe Sharing / Import / Export / Backup\n\n**Working branch:** `feature/v0.7-safe-sharing`  \n**Target version:** `0.7.0` / versionCode `700`  \n**Milestone issue:** `#19`\n\nv0.7 is actively being verified and is **not yet merged/release-ready**. The branch adds checksum-protected puzzle codes, bounded backup codecs, duplicate-safe local restore, Backup & Transfer UI, clipboard/share actions, Storage Access Framework file import/export without broad storage permission, puzzle sharing from player-data surfaces, and account-free result sharing.\n\nSecurity hardening includes strict schema/version checks, a 2 MiB backup bound, record-count limits, bounded metadata fields/counters/timestamps, non-negative challenge keys, puzzle/solution consistency, uniqueness validation before imported puzzles are playable, and rejection of modified checksums. Imported Room IDs are never trusted or reused.\n\nRoom restore is transactional and duplicate-safe; backed-up DataStore settings are applied only after the Room transaction succeeds. Because Room and DataStore are separate stores, cross-store atomicity is not claimed.\n\nNew tests cover puzzle-code validation, backup round trips/tampering, bounded file streams, metadata hardening, duplicate-safe restore, restored settings, and Backup & Transfer navigation. Detailed format/security documentation is in `docs/TRANSFER_BACKUP_V07.md`.\n\nThe v0.7 milestone must pass both standard Android CI and API-35 connected instrumentation on the final PR head before merge.\n\n'''
          if '## Current v0.7 Development — Safe Sharing / Import / Export / Backup' not in text:
              text = text.replace(marker, section, 1)
          changed.write_text(text)

          roadmap = Path('ROADMAP.md')
          text = roadmap.read_text()
          note = '''\n## v0.7 — Safe Sharing / Import / Export / Backup\n\nIn active development on the cumulative branch line. Scope includes versioned puzzle codes, checksum/bounds validation, duplicate-safe local backup restore, clipboard/share, Android document-picker file transfer, puzzle/result sharing, English/Hindi resources, and security/testing documentation. Merge requires standard CI plus API-35 connected instrumentation.\n'''
          if '## v0.7 — Safe Sharing / Import / Export / Backup' not in text:
              text += note
          roadmap.write_text(text)
          PY
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add what_changed.md ROADMAP.md
          git commit -m "docs: record active v0.7 transfer milestone" || true
          git push origin HEAD:feature/v0.7-safe-sharing
