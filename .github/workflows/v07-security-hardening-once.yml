name: Harden v0.7 Import Once

on:
  push:
    branches:
      - feature/v0.7-safe-sharing
    paths:
      - '.github/workflows/v07-security-hardening-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.7-safe-sharing
          fetch-depth: 0
      - name: Harden imported timestamps, challenge keys, and clipboard bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          codec = Path('app/src/main/java/com/sanskar/sudokunova/data/transfer/BackupCodec.kt')
          text = codec.read_text()
          if 'MAX_EPOCH_MILLIS' not in text:
              text = text.replace(
                  '    private const val MAX_ELAPSED_SECONDS = 315_576_000L\n',
                  '    private const val MAX_ELAPSED_SECONDS = 315_576_000L\n    private const val MAX_EPOCH_MILLIS = 32_503_680_000_000L\n',
              )
          text = text.replace(
              '        require(record.startedAtEpochMillis >= 0L)\n        require(record.completedAtEpochMillis == null || record.completedAtEpochMillis >= 0L)\n',
              '        require(record.startedAtEpochMillis in 0..MAX_EPOCH_MILLIS)\n        require(record.completedAtEpochMillis == null || record.completedAtEpochMillis in record.startedAtEpochMillis..MAX_EPOCH_MILLIS)\n        require(record.isPerfect == (record.mistakes == 0 && record.hintsUsed == 0))\n',
          )
          text = text.replace(
              '        val started = fields[8].toLong().also { require(it >= 0L) }\n        val completedAt = fields[9].takeIf(String::isNotBlank)?.toLong()?.also { require(it >= 0L) }\n',
              '        val started = fields[8].toLong().also { require(it in 0..MAX_EPOCH_MILLIS) }\n        val completedAt = fields[9].takeIf(String::isNotBlank)?.toLong()?.also { require(it in started..MAX_EPOCH_MILLIS) }\n        val perfect = fields[11].toBooleanStrict()\n        require(perfect == (mistakes == 0 && hints == 0))\n',
          )
          text = text.replace(
              '            isPerfect = fields[11].toBooleanStrict(),\n',
              '            isPerfect = perfect,\n',
          )
          text = text.replace(
              '        require(record.completedAtEpochMillis >= 0L)\n',
              '        require(record.challengeKey >= 0L)\n        require(record.completedAtEpochMillis in 0..MAX_EPOCH_MILLIS)\n        require(record.perfect == (record.mistakes == 0 && record.hintsUsed == 0))\n',
          )
          text = text.replace(
              '        val key = fields[2].toLong()\n',
              '        val key = fields[2].toLong().also { require(it >= 0L) }\n',
          )
          text = text.replace(
              '        val completedAt = fields[8].toLong().also { require(it >= 0L) }\n',
              '        val completedAt = fields[8].toLong().also { require(it in 0..MAX_EPOCH_MILLIS) }\n        val perfect = fields[9].toBooleanStrict()\n        require(perfect == (mistakes == 0 && hints == 0))\n',
          )
          text = text.replace(
              '            perfect = fields[9].toBooleanStrict(),\n',
              '            perfect = perfect,\n',
          )
          codec.write_text(text)

          vm = Path('app/src/main/java/com/sanskar/sudokunova/ui/transfer/TransferViewModel.kt')
          text = vm.read_text()
          if 'BackupCodec' not in text:
              text = text.replace(
                  'import com.sanskar.sudokunova.data.transfer.BackupImportResult\n',
                  'import com.sanskar.sudokunova.data.transfer.BackupCodec\nimport com.sanskar.sudokunova.data.transfer.BackupImportResult\n',
              )
          old = '''    fun restoreBackup(raw: String) {\n        viewModelScope.launch {\n'''
          new = '''    fun restoreBackup(raw: String) {\n        if (raw.length > BackupCodec.MAX_BACKUP_BYTES) {\n            _uiState.value = _uiState.value.copy(importResult = null, status = TransferStatus.RESTORE_INVALID)\n            return\n        }\n        viewModelScope.launch {\n'''
          text = text.replace(old, new)
          vm.write_text(text)
          PY
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add app/src/main/java/com/sanskar/sudokunova/data/transfer/BackupCodec.kt \
                  app/src/main/java/com/sanskar/sudokunova/ui/transfer/TransferViewModel.kt
          git commit -m "fix: harden v0.7 imported metadata validation" || true
          git push origin HEAD:feature/v0.7-safe-sharing
