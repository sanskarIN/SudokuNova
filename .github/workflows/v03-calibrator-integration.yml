name: Apply v0.3 Logical Solver Calibration Integration

on:
  push:
    branches:
      - feature/v0.3-difficulty-calibration
    paths:
      - .github/workflows/v03-calibrator-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.3-difficulty-calibration
          fetch-depth: 0

      - name: Integrate logic-only solver evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > sudoku-engine/src/main/kotlin/com/sanskar/sudokunova/engine/DifficultyCalibrator.kt <<'KOTLIN'
          package com.sanskar.sudokunova.engine

          data class CalibratedDifficultyAssessment(
              val requestedDifficulty: Difficulty,
              val legacyAssessment: DifficultyAssessment,
              val logicalEvidence: LogicalDifficultyEvidence,
              val logicalSolveResult: LogicalSolveResult,
              val combinedScore: Int,
              val suggestedDifficulty: Difficulty,
          ) {
              val matchesRequestedBand: Boolean
                  get() = suggestedDifficulty == requestedDifficulty

              val unresolvedAfterSupportedLogic: Int
                  get() = logicalSolveResult.unresolvedCells
          }

          /**
           * Combines the established search-metric rating with logic-only evidence.
           *
           * During v0.3 this remains observational: the generator still protects validity and
           * uniqueness with its existing acceptance rules while deterministic corpus tests collect
           * evidence for future threshold calibration.
           */
          object DifficultyCalibrator {
              fun calibrate(
                  board: SudokuBoard,
                  legacyAssessment: DifficultyAssessment,
                  requestedDifficulty: Difficulty,
              ): CalibratedDifficultyAssessment {
                  val logical = LogicalDifficultyAnalyzer.analyze(board)
                  val logicSolve = LogicalSolver().solve(board)
                  val hardestTechniqueWeight = (logicSolve.hardestTechnique?.rank ?: 0) * 35
                  val unresolvedWeight = logicSolve.unresolvedCells * 14
                  val eliminationWeight = logicSolve.candidateEliminations.coerceAtMost(100) * 2
                  val signalWeight = logical.logicalScore / 20

                  val combinedScore = (
                      legacyAssessment.score +
                          hardestTechniqueWeight +
                          unresolvedWeight +
                          eliminationWeight +
                          signalWeight
                      ).coerceAtLeast(0)

                  val suggested = Difficulty.entries
                      .filter { combinedScore >= it.minimumScore }
                      .maxByOrNull { it.minimumScore }
                      ?: Difficulty.entries.minBy { it.minimumScore }

                  return CalibratedDifficultyAssessment(
                      requestedDifficulty = requestedDifficulty,
                      legacyAssessment = legacyAssessment,
                      logicalEvidence = logical,
                      logicalSolveResult = logicSolve,
                      combinedScore = combinedScore,
                      suggestedDifficulty = suggested,
                  )
              }
          }
          KOTLIN

          git rm .github/workflows/v03-calibrator-integration.yml
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add sudoku-engine/src/main/kotlin/com/sanskar/sudokunova/engine/DifficultyCalibrator.kt
          git commit -m 'feat: include logic-only solver evidence in calibration'

          for attempt in 1 2 3 4 5 6; do
            git fetch origin feature/v0.3-difficulty-calibration
            git rebase origin/feature/v0.3-difficulty-calibration
            if git push origin HEAD:feature/v0.3-difficulty-calibration; then
              exit 0
            fi
            sleep 2
          done
          exit 1
