name: Apply v0.2 Saved Game Integrity Fix

on:
  push:
    branches:
      - feature/v0.2-gameplay-hardening
    paths:
      - .github/workflows/v02-save-integrity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.2-gameplay-hardening
          fetch-depth: 0

      - name: Enforce structural validation for decoded game state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          state_path = Path('app/src/main/java/com/sanskar/sudokunova/game/GameState.kt')
          state = state_path.read_text()
          old_init = '''    init {
              require(selectedNumber == null || selectedNumber in 1..9) {
                  "Selected number must be null or in the range 1..9."
              }
          }
          '''
          new_init = '''    init {
              require(selectedIndex in 0 until SudokuBoard.CELL_COUNT) {
                  "Selected cell index must be in the Sudoku board range."
              }
              require(selectedNumber == null || selectedNumber in 1..9) {
                  "Selected number must be null or in the range 1..9."
              }
          }
          '''
          if old_init not in state:
              raise SystemExit('GameState init block not found')
          state_path.write_text(state.replace(old_init, new_init, 1))

          codec_path = Path('app/src/main/java/com/sanskar/sudokunova/game/GameStateCodec.kt')
          codec = codec_path.read_text()
          old_decode = '''    fun decode(encoded: String): GameState? = runCatching {
              val parts = encoded.split('|')
              when (parts.firstOrNull()) {
                  VERSION_1 -> decodeV1(parts)
                  VERSION_2 -> decodeV2(parts)
                  else -> error("Unsupported saved-game version.")
              }
          }.getOrNull()
          '''
          new_decode = '''    fun decode(encoded: String): GameState? = runCatching {
              val parts = encoded.split('|')
              val state = when (parts.firstOrNull()) {
                  VERSION_1 -> decodeV1(parts)
                  VERSION_2 -> decodeV2(parts)
                  else -> error("Unsupported saved-game version.")
              }
              require(GameStateIntegrity.isValid(state)) {
                  "Saved game failed structural integrity validation."
              }
              state
          }.getOrNull()
          '''
          if old_decode not in codec:
              raise SystemExit('GameStateCodec decode block not found')
          codec = codec.replace(old_decode, new_decode, 1)
          codec = codec.replace(
              'selectedIndex = parts[5].toInt().coerceIn(0, SudokuBoard.CELL_COUNT - 1),',
              'selectedIndex = parts[5].toInt(),',
          )
          codec_path.write_text(codec)
          PY

          git rm .github/workflows/v02-save-integrity-fix.yml
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add app/src/main/java/com/sanskar/sudokunova/game/GameState.kt app/src/main/java/com/sanskar/sudokunova/game/GameStateCodec.kt
          git commit -m 'fix: reject structurally corrupted saved games'

          for attempt in 1 2 3 4 5 6; do
            git fetch origin feature/v0.2-gameplay-hardening
            git rebase origin/feature/v0.2-gameplay-hardening
            if git push origin HEAD:feature/v0.2-gameplay-hardening; then
              exit 0
            fi
            sleep 2
          done
          exit 1
