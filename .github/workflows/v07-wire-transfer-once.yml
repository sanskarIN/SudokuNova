name: Wire v0.7 Transfer Once

on:
  push:
    branches:
      - feature/v0.7-safe-sharing
    paths:
      - '.github/workflows/v07-wire-transfer-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.7-safe-sharing
          fetch-depth: 0

      - name: Wire transfer UI and v0.7 verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app/src/main/java/com/sanskar/sudokunova/ui/SudokuNovaApp.kt')
          text = app.read_text()
          if 'ui.transfer.TransferRoute' not in text:
              text = text.replace(
                  'import com.sanskar.sudokunova.ui.theme.SudokuNovaTheme\n',
                  'import com.sanskar.sudokunova.ui.theme.SudokuNovaTheme\nimport com.sanskar.sudokunova.ui.transfer.TransferRoute\n',
              )
          if 'const val TRANSFER = "transfer"' not in text:
              text = text.replace(
                  '    const val SAVED = "saved"\n',
                  '    const val SAVED = "saved"\n    const val TRANSFER = "transfer"\n',
              )
          if 'composable(Routes.TRANSFER)' not in text:
              marker = '''            composable(Routes.LEARN) {\n                LearnScreen(onBack = { navController.popBackStack() })\n            }\n'''
              block = '''            composable(Routes.TRANSFER) {\n                TransferRoute(\n                    onBack = { navController.popBackStack() },\n                    onPlayImported = { puzzle, difficulty ->\n                        navController.navigate(\n                            "game/${difficulty.name}?daily=false&resume=false&custom=$puzzle",\n                        )\n                    },\n                )\n            }\n\n'''
              text = text.replace(marker, block + marker)
          if 'onBackupTransfer = { navController.navigate(Routes.TRANSFER) }' not in text:
              text = text.replace(
                  '                    onMistakeLimit = appViewModel::setMistakeLimit,\n',
                  '                    onMistakeLimit = appViewModel::setMistakeLimit,\n                    onBackupTransfer = { navController.navigate(Routes.TRANSFER) },\n',
              )
          app.write_text(text)

          settings = Path('app/src/main/java/com/sanskar/sudokunova/ui/settings/SettingsScreen.kt')
          text = settings.read_text()
          if 'onBackupTransfer: () -> Unit,' not in text:
              text = text.replace(
                  '    onMistakeLimit: (Int) -> Unit,\n',
                  '    onMistakeLimit: (Int) -> Unit,\n    onBackupTransfer: () -> Unit,\n',
              )
          if 'R.string.v07_backup_transfer' not in text:
              marker = '''            item { SectionTitle(stringResource(R.string.v04_data)) }\n'''
              block = '''            item { SectionTitle(stringResource(R.string.v04_data)) }\n            item {\n                ListItem(\n                    headlineContent = { Text(stringResource(R.string.v07_backup_transfer)) },\n                    supportingContent = { Text(stringResource(R.string.v07_backup_transfer_desc)) },\n                    trailingContent = {\n                        TextButton(onClick = onBackupTransfer) {\n                            Text(stringResource(R.string.v07_backup_transfer))\n                        }\n                    },\n                )\n            }\n'''
              text = text.replace(marker, block)
          settings.write_text(text)

          verifier = Path('scripts/verify_translations.py')
          text = verifier.read_text()
          if '"v07_"' not in text:
              text = text.replace(
                  'PREFIXES = ("v04_", "v05_", "v06_", "difficulty_", "theme_")',
                  'PREFIXES = ("v04_", "v05_", "v06_", "v07_", "difficulty_", "theme_")',
              )
          verifier.write_text(text)

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          text = text.replace('versionCode = 600', 'versionCode = 700')
          text = text.replace('versionName = "0.6.0"', 'versionName = "0.7.0"')
          build.write_text(text)
          PY

          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add app/src/main/java/com/sanskar/sudokunova/ui/SudokuNovaApp.kt \
                  app/src/main/java/com/sanskar/sudokunova/ui/settings/SettingsScreen.kt \
                  scripts/verify_translations.py app/build.gradle.kts
          git commit -m "feat: wire Backup and Transfer into v0.7 app" || true
          git push origin HEAD:feature/v0.7-safe-sharing
