name: Fix Kotlin Package Namespace

on:
  push:
    branches:
      - feature/bootstrap-v0.1
    paths:
      - .github/workflows/fix-kotlin-package.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/bootstrap-v0.1
          fetch-depth: 0

      - name: Move Kotlin source directories
        shell: bash
        run: |
          set -euo pipefail
          for root in \
            app/src/main/java \
            app/src/test/java \
            app/src/androidTest/java \
            sudoku-engine/src/main/kotlin \
            sudoku-engine/src/test/kotlin; do
            if [ -d "$root/in/sanskar" ]; then
              mkdir -p "$root/com"
              git mv "$root/in/sanskar" "$root/com/sanskar"
              rmdir "$root/in" 2>/dev/null || true
            fi
          done

      - name: Replace Kotlin namespace references
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --exclude-dir=.git 'in\.sanskar\.sudokunova' app sudoku-engine \
            | xargs -r sed -i 's/in\.sanskar\.sudokunova/com.sanskar.sudokunova/g'
          sed -i 's/namespace = "in\.sanskar\.sudokunova"/namespace = "com.sanskar.sudokunova"/' app/build.gradle.kts
          # Preserve the externally visible Android application ID requested by the project.
          sed -i 's/applicationId = "com\.sanskar\.sudokunova"/applicationId = "in.sanskar.sudokunova"/' app/build.gradle.kts

      - name: Commit namespace migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add -A
          git commit -m 'fix: migrate Kotlin namespace away from reserved keyword'
          git push origin HEAD:feature/bootstrap-v0.1
