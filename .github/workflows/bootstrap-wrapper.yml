name: Bootstrap Gradle Wrapper

on:
  push:
    branches:
      - feature/bootstrap-v0.1
    paths:
      - .github/workflows/bootstrap-wrapper.yml

permissions:
  contents: write

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: feature/bootstrap-v0.1
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Generate official wrapper
        run: gradle wrapper --gradle-version 9.5.0 --distribution-type bin

      - name: Verify wrapper JAR checksum
        shell: bash
        run: |
          expected='497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7'
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Commit generated wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
          if git diff --cached --quiet; then
            echo 'Wrapper already current.'
            exit 0
          fi

          git commit -m 'build: generate official Gradle 9.5 wrapper'

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin feature/bootstrap-v0.1
            git rebase origin/feature/bootstrap-v0.1
            if git push origin HEAD:feature/bootstrap-v0.1; then
              exit 0
            fi
            echo "Push raced with another commit; retrying attempt ${attempt}/8."
            sleep 2
          done

          echo 'Unable to push the verified wrapper after retries.' >&2
          exit 1
