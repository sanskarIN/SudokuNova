name: Sync main into consolidated branch once

on:
  push:
    branches:
      - feature/v0.6-consolidated
    paths:
      - '.github/workflows/sync-main-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consolidated branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.6-consolidated
          fetch-depth: 0

      - name: Merge current main while preserving consolidated conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff -X ours origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -z "$unresolved" ]; then
              echo "Merge failed without resolvable content conflicts."
              exit "$merge_status"
            fi
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              git checkout --ours -- "$path"
              git add "$path"
            done <<< "$unresolved"
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Unresolved conflicts remain."
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi

          rm -f .github/workflows/sync-main-once.yml
          git add -A

          if git diff --cached --quiet; then
            echo "No synchronization changes were required."
            exit 0
          fi

          git commit -m "chore: sync current main into consolidated branch"
          git push origin HEAD:feature/v0.6-consolidated
