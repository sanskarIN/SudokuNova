name: Wire v0.7 Transfer Smoke Once

on:
  push:
    branches:
      - feature/v0.7-safe-sharing
    paths:
      - '.github/workflows/v07-transfer-smoke-once.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.7-safe-sharing
          fetch-depth: 0
      - name: Add Backup and Transfer navigation smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/androidTest/java/com/sanskar/sudokunova/MainActivityTest.kt')
          text = path.read_text()
          if 'hasScrollAction' not in text:
              text = text.replace(
                  'import androidx.compose.ui.test.assertIsDisplayed\n',
                  'import androidx.compose.ui.test.assertIsDisplayed\nimport androidx.compose.ui.test.hasScrollAction\nimport androidx.compose.ui.test.hasText\n',
              )
          if 'performScrollToNode' not in text:
              text = text.replace(
                  'import androidx.compose.ui.test.performScrollTo\n',
                  'import androidx.compose.ui.test.performScrollTo\nimport androidx.compose.ui.test.performScrollToNode\n',
              )
          if 'backupAndTransferIsReachableFromSettings' not in text:
              insert = '''\n    @Test\n    fun backupAndTransferIsReachableFromSettings() {\n        composeRule.onNodeWithText("Settings").performScrollTo().performClick()\n        composeRule.onNode(hasScrollAction())\n            .performScrollToNode(hasText("Backup & Transfer"))\n        composeRule.onNodeWithText("Backup & Transfer").performClick()\n        composeRule.onNodeWithText("Backup & Transfer").assertIsDisplayed()\n        composeRule.onNodeWithText("Puzzle codes").assertIsDisplayed()\n        composeRule.onNodeWithText("Copy backup").performScrollTo().assertIsDisplayed()\n    }\n'''
              text = text.replace('\n    @Test\n    fun customPuzzleEditorIsReachable()', insert + '\n    @Test\n    fun customPuzzleEditorIsReachable()')
          path.write_text(text)
          PY
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add app/src/androidTest/java/com/sanskar/sudokunova/MainActivityTest.kt
          git commit -m "test: cover Backup and Transfer navigation" || true
          git push origin HEAD:feature/v0.7-safe-sharing
