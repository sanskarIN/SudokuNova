name: Apply v0.5 Version and Documentation

on:
  push:
    branches:
      - feature/v0.5-player-history
    paths:
      - .github/workflows/v05-version-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.5-player-history
          fetch-depth: 0

      - name: Update v0.5 version and documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          text = build.read_text()
          text = text.replace('versionCode = 400', 'versionCode = 500', 1)
          text = text.replace('versionName = "0.4.0"', 'versionName = "0.5.0"', 1)
          build.write_text(text)

          docs_index = Path('docs/README.md')
          text = docs_index.read_text()
          link = '- [History and Saved Puzzles](HISTORY_AND_SAVED_PUZZLES.md)\n'
          if link not in text:
              marker = '- [Data Storage](DATA_STORAGE.md)\n'
              if marker in text:
                  text = text.replace(marker, marker + link, 1)
              else:
                  text += '\n' + link
          docs_index.write_text(text)

          data_storage = Path('docs/DATA_STORAGE.md')
          text = data_storage.read_text()
          appendix = '''\n## v0.5 Room History Database\n\nSudokuNova now uses a Room database named `sudokunova.db` for completed-game history and saved puzzles. The initial Room schema is version 1 and is exported to `app/schemas/`. DataStore remains responsible for lightweight settings, active-game state, and aggregate statistics.\n\nProduction database construction does not use destructive migration. Any future schema version must include an explicit migration and migration test. See [History and Saved Puzzles](HISTORY_AND_SAVED_PUZZLES.md).\n'''
          if '## v0.5 Room History Database' not in text:
              text += appendix
          data_storage.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '### Added\n'
          block = '''### Added\n- v0.5 development: Room schema v1 for completed-game history and saved puzzles with exported schema JSON.\n- v0.5 development: History screen with favorites, difficulty filters, per-difficulty summaries, deletion, and replay.\n- v0.5 development: Saved Puzzles screen with favorites, deletion, and replayable validated custom puzzles.\n- v0.5 development: replay provenance so replay attempts stay visible without inflating normal aggregate statistics.\n- v0.5 development: connected Room persistence tests and History/Saved Compose navigation tests.\n'''
          if 'v0.5 development: Room schema v1' not in text and marker in text:
              text = text.replace(marker, block, 1)
          changelog.write_text(text)

          changed = Path('what_changed.md')
          text = changed.read_text()
          text = text.replace('**v0.4.0-development**', '**v0.5.0-development**', 1)
          text = text.replace(
              'Current working branch: `feature/v0.4-accessibility-localization`',
              'Current working branch: `feature/v0.5-player-history`',
              1,
          )
          appendix = '''\n## v0.5 Player History and Saved Puzzles\n\nImplemented and pushed:\n\n- Room 2.8.3 persistence configured with Kotlin kapt and schema export.\n- `SudokuNovaDatabase` schema v1 with `game_history` and `saved_puzzles`.\n- Game history DAO/repository with newest-first history, favorites, difficulty filtering, and per-difficulty summaries.\n- Saved puzzle DAO/repository with a unique puzzle index, favorites, and deletion.\n- Completed games are persisted into Room in addition to existing DataStore aggregates.\n- History UI with All/Favorites scope, difficulty filters, summary cards, favorite/delete actions, and replay.\n- Saved Puzzles UI with All/Favorites scope, favorite/delete actions, and play flow.\n- Validated custom puzzles can be saved locally with duplicate detection.\n- Replay provenance is carried through `GameState` codec v3 and history rows.\n- Replay attempts remain visible but are excluded from normal per-difficulty summary statistics and do not increment DataStore aggregate progression statistics.\n- Room instrumentation tests cover insert/read, favorites, summary aggregation, unique saved-puzzle constraints, and replay summary exclusion.\n- Compose smoke tests cover History and Saved Puzzles navigation.\n- Room schema v1 is exported and committed under `app/schemas/`.\n- Added `docs/HISTORY_AND_SAVED_PUZZLES.md`.\n- v0.5 English/Hindi resource parity is enforced by the existing translation checker.\n- Android development version advanced to `0.5.0` / versionCode `500`.\n\nRoom schema v1 is the first Room schema; there is no prior Room schema to migrate. Starting with schema v2, explicit migrations and migration tests are mandatory.\n'''
          if '## v0.5 Player History and Saved Puzzles' not in text:
              text += appendix
          changed.write_text(text)
          PY

          git rm .github/workflows/v05-version-docs.yml
          git config user.name 'Sanskar'
          git config user.email 'sanskarin@outlook.in'
          git add app/build.gradle.kts docs/README.md docs/DATA_STORAGE.md CHANGELOG.md what_changed.md
          git commit -m 'docs: record v0.5 Room history and saved puzzles'

          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin feature/v0.5-player-history
            git rebase origin/feature/v0.5-player-history
            if git push origin HEAD:feature/v0.5-player-history; then exit 0; fi
            sleep 2
          done
          exit 1
