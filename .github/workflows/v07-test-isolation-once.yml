name: Fix v0.7 Test Isolation Once

on:
  push:
    branches:
      - feature/v0.7-safe-sharing
    paths:
      - '.github/workflows/v07-test-isolation-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.7-safe-sharing
          fetch-depth: 0
      - name: Reset settings after backup instrumentation tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/androidTest/java/com/sanskar/sudokunova/data/transfer/BackupRepositoryTest.kt')
          text = path.read_text()
          if 'import com.sanskar.sudokunova.data.restoreSettings' not in text:
              text = text.replace(
                  'import com.sanskar.sudokunova.data.UserSettings\n',
                  'import com.sanskar.sudokunova.data.UserSettings\nimport com.sanskar.sudokunova.data.restoreSettings\n',
              )
          old = '''    fun tearDown() = runBlocking {\n        database.gameHistoryDao().deleteAll()\n        database.savedPuzzleDao().deleteAll()\n        database.challengeResultDao().deleteAll()\n    }\n'''
          new = '''    fun tearDown() = runBlocking {\n        database.gameHistoryDao().deleteAll()\n        database.savedPuzzleDao().deleteAll()\n        database.challengeResultDao().deleteAll()\n        AppPreferencesRepository(context).restoreSettings(UserSettings())\n    }\n'''
          text = text.replace(old, new)
          path.write_text(text)
          PY
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add app/src/androidTest/java/com/sanskar/sudokunova/data/transfer/BackupRepositoryTest.kt
          git commit -m "test: isolate backup restore settings state" || true
          git push origin HEAD:feature/v0.7-safe-sharing
